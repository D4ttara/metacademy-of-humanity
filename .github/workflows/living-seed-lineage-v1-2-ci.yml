name: Living Seed Lineage v1.2 CI

on:
  pull_request:
    paths:
      - 'uk/research/living-seed-lineage/**'
      - 'research/living-seed-lineage/**'
      - 'uk/research/index.html'
      - 'research/index.html'
      - 'scripts/render-living-seed-lineage-v1.2.mjs'
      - 'scripts/inject-living-seed-lineage-*.mjs'
      - 'scripts/verify-living-seed-lineage-v1.2.mjs'
      - 'sitemap.xml'
      - 'feed.xml'
      - 'llms.txt'
      - '.github/workflows/living-seed-lineage-v1-2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Living Seed renderer dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - name: Build Living Seed public editions and discovery
        run: node scripts/inject-living-seed-lineage-discovery.mjs
      - name: Verify approved wording, lineage and publication surfaces
        run: node scripts/verify-living-seed-lineage-v1.2.mjs
