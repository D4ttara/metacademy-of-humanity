name: Manifesto lineage CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'manifesto/**'
      - 'manifestos/**'
      - 'uk/manifestos/**'
      - 'documents/017-human-ai-what-or-we/**'
      - 'scripts/assemble-document-017-source.sh'
      - 'scripts/build-manifesto-formats.sh'
      - 'scripts/prepare-manifesto-public-surfaces.mjs'
      - 'scripts/verify-manifesto-lineage.mjs'
      - '.github/workflows/manifesto-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install manifesto publication toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-latex-extra texlive-fonts-extra texlive-fonts-recommended lmodern fonts-ibm-plex fonts-dejavu-core fonts-symbola poppler-utils
      - name: Assemble Document 017 v1.0 provenance witness
        run: bash scripts/assemble-document-017-source.sh
      - name: Build manifesto lineage public formats
        run: bash scripts/build-manifesto-formats.sh
      - name: Prepare public HTML surfaces
        run: node scripts/prepare-manifesto-public-surfaces.mjs
      - name: Verify manifesto lineage and Document 017 v1.1
        run: node scripts/verify-manifesto-lineage.mjs
      - name: Manifesto PDF preflight
        shell: bash
        run: |
          mapfile -t files < <(find manifestos/archive/metacademy-continuity -type f -name '*_PUBLIC.pdf' -print | sort)
          if [[ "${#files[@]}" -ne 5 ]]; then
            printf 'Expected 5 manifesto public PDFs, found %s\n' "${#files[@]}"
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          for f in "${files[@]}"; do
            test -s "$f"
            pdfinfo "$f" >/dev/null
            pdffonts "$f" | grep -q 'IBMPlexSans'
          done
          for f in manifestos/archive/metacademy-continuity/v1.1/*_PUBLIC.pdf manifestos/archive/metacademy-continuity/v1.2/*_PUBLIC.pdf; do
            pdftotext "$f" - | grep -Fq 'Ȧ'
          done
          echo 'MANIFESTO_PDF_PREFLIGHT=PASS files=5 document_017=HTML_MD_ONLY canonical_A_dot=PASS'
      - name: Upload manifesto QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manifesto-public-formats
          if-no-files-found: error
          retention-days: 7
          path: |
            manifestos/archive/metacademy-continuity/**/*_PUBLIC.pdf
            manifestos/archive/metacademy-continuity/**/*_PUBLIC.epub
            manifestos/archive/metacademy-continuity/**/*_PUBLIC.docx
            documents/017-human-ai-what-or-we/METACADEMY_DOCUMENT_017_HUMAN_AI_WHAT_OR_WE_UA_v1.1.md
            documents/017-human-ai-what-or-we/ua/index.html
