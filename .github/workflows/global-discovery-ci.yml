name: Global search and AI discovery CI

on:
  pull_request:
    paths:
      - 'index.html'
      - 'uk/**'
      - 'documents/**'
      - 'manifesto/**'
      - 'manifestos/**'
      - 'research/**'
      - 'science-aperture/**'
      - 'fields/**'
      - 'library/**'
      - 'books/**'
      - 'shop/**'
      - 'arena/**'
      - 'topics/**'
      - 'start/**'
      - 'corpus/**'
      - 'programs/**'
      - 'questions/**'
      - 'memory/**'
      - 'identity/**'
      - 'discover/**'
      - 'assets/css/experience.css'
      - 'assets/js/experience.js'
      - 'robots.txt'
      - 'llms.txt'
      - 'feed.xml'
      - 'CITATION.cff'
      - 'AI_DISCOVERY.md'
      - 'scripts/build-global-discovery.mjs'
      - 'scripts/inject-static-shop-links.mjs'
      - 'scripts/inject-arena-discovery.mjs'
      - 'scripts/verify-global-discovery.mjs'
      - '.github/workflows/global-discovery-ci.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'uk/**'
      - 'documents/**'
      - 'manifesto/**'
      - 'manifestos/**'
      - 'research/**'
      - 'science-aperture/**'
      - 'fields/**'
      - 'library/**'
      - 'books/**'
      - 'shop/**'
      - 'arena/**'
      - 'topics/**'
      - 'start/**'
      - 'corpus/**'
      - 'programs/**'
      - 'questions/**'
      - 'memory/**'
      - 'identity/**'
      - 'discover/**'
      - 'assets/css/experience.css'
      - 'assets/js/experience.js'
      - 'robots.txt'
      - 'llms.txt'
      - 'CITATION.cff'
      - 'AI_DISCOVERY.md'
      - 'scripts/build-global-discovery.mjs'
      - 'scripts/inject-static-shop-links.mjs'
      - 'scripts/inject-arena-discovery.mjs'
      - 'scripts/verify-global-discovery.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check discovery and experience scripts
        run: |
          node --check assets/js/experience.js
          node --check scripts/build-global-discovery.mjs
          node --check scripts/inject-static-shop-links.mjs
          node --check scripts/inject-arena-discovery.mjs
          node --check scripts/verify-global-discovery.mjs
      - name: Build canonical search, store and AI discovery surfaces
        run: node scripts/build-global-discovery.mjs
      - name: Guarantee static shop navigation
        run: node scripts/inject-static-shop-links.mjs
      - name: Inject AI Arena into machine discovery
        run: node scripts/inject-arena-discovery.mjs
      - name: Verify discovery and modern experience coverage
        run: node scripts/verify-global-discovery.mjs
      - name: Check generated text patches
        run: git diff --check
