name: Public site bug
description: Report a broken route, accessibility issue or visual defect.
title: "[Site bug]: "
labels: ["site-bug"]
body:
  - type: input
    attributes: {label: Page URL}
    validations: {required: true}
  - type: textarea
    attributes: {label: What happened}
    validations: {required: true}
  - type: textarea
    attributes: {label: Expected behaviour}
    validations: {required: true}
