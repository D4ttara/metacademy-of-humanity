schema: active-research-passports/v1
scope_notice: "ACTIVE_RESEARCH != UNIVERSAL_TRUTH; synthetic fixture success is not a natural-world verdict."
owner_decision: APPROVED_2026-08-12
source:
  - SCIENCE_APERTURE_#001
  - SCIENCE_APERTURE_#002
common:
  status: OWNER_APPROVED_ACTIVE_RESEARCH
  can_deactivate: true
  can_park_later: true
  action_authority: NONE
operators:
  - name: BEHAVIORAL_SIMILARITY_NEQ_ONTOLOGICAL_IDENTITY
    ua_gloss: "ПОВЕДІНКОВА СХОЖІСТЬ != ОНТОЛОГІЧНА ТОТОЖНІСТЬ"
    scope: "Meta.Logic epistemic guard"
    claim_class: "research guard"
    lineage: "Science Aperture #001 → Document 003"
    input: "observed behavior; similarity class"
    output: "behavior/equivalence/ontology distinction with unknown"
    fixtures: ["chemical garden imitation"]
    counterexamples: ["similar behavior without declared target architecture"]
    representational_cost: "six explicit evidence fields"
    failure_modes: ["ontology inferred from resemblance"]
    dependencies: ["provenance"]
    promotion_condition: "repeated domain-specific utility"
    demotion_condition: "distinction adds no decision value"
    revision_status: "ACTIVE_RESEARCH"
  - name: AUTONOMY_PROFILE
    ua_gloss: "ПРОФІЛЬ АВТОНОМНОСТІ"
    scope: "Meta.Logic, MORPHO, IKAR"
    claim_class: "multidimensional research interface"
    lineage: "Science Aperture #001 → Document 003"
    input: "twelve candidate dimensions"
    output: "PROFILE_NOT_BINARY"
    fixtures: ["same headline capability; different human dependence"]
    counterexamples: ["domains not instantiating every dimension"]
    representational_cost: "dimension collection and gaps"
    failure_modes: ["binary label smuggled back in"]
    dependencies: ["observed provenance"]
    promotion_condition: "improves comparison over binary label"
    demotion_condition: "domain schema is inadequate"
    revision_status: "ACTIVE_RESEARCH"
